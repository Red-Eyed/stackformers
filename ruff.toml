line-length = 100
cache-dir = "work_dir/ruff-cache"

[lint]
select = ["E", "F", "I", "TID251", "UP"]
# jaxtyping shape strings are not valid Python syntax — these are intentional
ignore = ["F722", "F821", "UP037"]

[lint.flake8-tidy-imports.banned-api]
"dataclasses".msg = "Use NamedTuple for tuple records or TypedDict for mapping records."
