required-version = ">=0.16.9"
target-version = "py311"
line-length = 100
cache-dir = "work_dir/ruff-cache"

[lint]
select = ["E", "F", "I", "TID251", "UP", "B", "ANN", "TC", "RUF100", "PGH003", "PGH004"]
# jaxtyping shape strings are not valid Python syntax — these are intentional
ignore = ["F722", "F821", "UP037"]

[lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
suppress-none-returning = false
suppress-dummy-args = false

[lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[lint.flake8-tidy-imports.banned-api]
"dataclasses".msg = "Use NamedTuple for tuple records or TypedDict for mapping records."
