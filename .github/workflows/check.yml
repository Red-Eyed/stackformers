name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.48.0"
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Report environment
        run: uv run python -c "import platform, torch; print(platform.python_version()); print(torch.__version__)"
      - name: Format, lint, type-check, and test
        run: just check
